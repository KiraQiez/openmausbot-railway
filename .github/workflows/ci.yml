# Checks only — Railway deploys from its own GitHub integration, not from here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow manual runs from the Actions tab

# Read-only token; nothing here needs to write to the repo.
permissions:
  contents: read

# Cancel an older run when a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast static checks so obvious mistakes fail before the slow build.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships with the ubuntu-latest runner.
      - name: ShellCheck
        run: shellcheck railway/*.sh

      # Use the same Caddy version as the Dockerfile. PORT is set because the
      # Caddyfile reads it.
      - name: Validate Caddyfile
        run: |
          docker run --rm -e PORT=8080 \
            -v "$PWD/railway/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build like Railway would, without pushing anywhere. Layers are cached in
      # GitHub Actions so unchanged steps (e.g. the npm install) are reused.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # make the image available to the next step
          tags: openmausbot-railway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Check the image without starting the server (that needs a volume and
      # a public URL). Bypass tini/start.sh and just inspect the files.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh openmausbot-railway:ci -c '
            set -e
            caddy version                      # Caddy copied in and runnable
            test -x /app/railway/start.sh      # entrypoint present + executable
            test -x /usr/local/bin/openmausbot # CLI wrapper installed
            test -f /app/railway/Caddyfile     # proxy config present
            id maus                            # runtime user exists
          '
